<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Colegio Nikola Tesla</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <!-- Fuente Honk -->
  <link href="https://fonts.googleapis.com/css2?family=Honk&display=swap" rel="stylesheet">
  <link href="ASSETS/CSS/login.css" rel="stylesheet">
</head>
<body class="d-flex align-items-center justify-content-center vh-100 bg-marfil">

  <div class="card login-card shadow-lg p-4">
    <div class="text-center mb-4">
      <i class="fas fa-graduation-cap fa-3x text-dorado"></i>
      <h2 class="login-title mt-2">Colegio Nikola Tesla</h2>
      <p class="login-subtitle">Accede a tu cuenta</p>
    </div>
    <form id="loginForm">
      <div class="mb-3">
        <label for="email" class="form-label">Correo electrónico</label>
        <div class="input-group">
          <span class="input-group-text text-borgoña"><i class="fas fa-envelope"></i></span>
          <input type="email" class="form-control" id="email" placeholder="ejemplo@correo.com" required>
        </div>
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Contraseña</label>
        <div class="input-group">
          <span class="input-group-text text-borgoña"><i class="fas fa-lock"></i></span>
          <input type="password" class="form-control" id="password" placeholder="********" required>
        </div>
      </div>
      <div class="d-grid gap-2">
        <button type="submit" class="btn btn-login">
          <i class="fas fa-sign-in-alt me-2"></i>Ingresar
        </button>
      </div>
    </form>
    <div class="text-center mt-3">
      <small class="login-footer">¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a></small>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.getElementById("loginForm").addEventListener("submit", function(e) {
      e.preventDefault();
      const email = document.getElementById("email").value;

      if (email.includes("admin")) {
        window.location.href = "ADMIN/dashboard.html";
      } else if (email.includes("usuario")) {
        window.location.href = "USUARIO/perfil.html";
      } else {
        alert("Credenciales inválidas. Usa admin o usuario en el correo para probar.");
      }
    });
  </script>
</body>
</html>
