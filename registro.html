<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro - Colegio Nikola Tesla</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <!-- Fuente Honk -->
  <link href="https://fonts.googleapis.com/css2?family=Honk&display=swap" rel="stylesheet">
  <!-- Tu CSS -->
  <link href="ASSETS/CSS/registro.css" rel="stylesheet">
</head>
<body>
  <div class="register-container">
    <h1><i class="fas fa-user-plus me-2"></i>Registro</h1>
    <form id="registerForm">
      <div class="mb-3">
        <label for="nombre" class="form-label"><i class="fas fa-user me-2"></i>Nombre completo</label>
        <input type="text" class="form-control" id="nombre" placeholder="Ingresa tu nombre" required>
      </div>
      <div class="mb-3">
        <label for="email" class="form-label"><i class="fas fa-envelope me-2"></i>Correo</label>
        <input type="email" class="form-control" id="email" placeholder="Ingresa tu correo" required>
      </div>
      <div class="mb-3">
        <label for="password" class="form-label"><i class="fas fa-lock me-2"></i>Contraseña</label>
        <input type="password" class="form-control" id="password" placeholder="Crea una contraseña" required>
      </div>
      <div class="mb-3">
        <label for="rol" class="form-label"><i class="fas fa-users-cog me-2"></i>Rol</label>
        <select class="form-select" id="rol" required>
          <option value="">Selecciona tu rol</option>
          <option value="usuario">Usuario</option>
          <option value="admin">Administrador</option>
        </select>
      </div>
      <button type="submit" class="btn btn-register w-100"><i class="fas fa-paper-plane me-2"></i>Registrarse</button>
      <p class="text-center mt-3 text-muted">¿Ya tienes cuenta? <a href="login.html">Inicia sesión aquí</a></p>
    </form>
  </div>

  <script>
    document.getElementById("registerForm").addEventListener("submit", function(event) {
      event.preventDefault();

      const rol = document.getElementById("rol").value;

      if (rol === "admin") {
        window.location.href = "ADMIN/dashboard.html";
      } else if (rol === "usuario") {
        window.location.href = "USUARIO/perfil.html";
      } else {
        alert("Por favor selecciona un rol válido.");
      }
    });
  </script>
</body>
</html>
